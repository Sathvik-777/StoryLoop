name: StoryLoop

on:
  # 06:00 Asia/Kolkata (UTC+05:30).
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Upload this run publicly to YouTube
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: storyloop-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    # A scheduled run stays dormant until auto-publishing is explicitly enabled.
    # Manual runs also require the user to choose the public-upload input.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'schedule' && vars.STORYLOOP_AUTO_PUBLISH == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

    steps:
      - name: Check out StoryLoop
        uses: actions/checkout@v4

      - name: Check required API secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          for name in OPENAI_API_KEY PEXELS_API_KEY YOUTUBE_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name repository secret before enabling StoryLoop."
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Prepare YouTube OAuth credentials
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import json

          required = ("YOUTUBE_CLIENT_SECRET_JSON", "YOUTUBE_TOKEN_JSON")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Public publishing is enabled, but required Actions secrets are missing: "
                  + ", ".join(missing)
              )

          token = json.loads(os.environ["YOUTUBE_TOKEN_JSON"])
          if not token.get("refresh_token"):
              raise SystemExit(
                  "YOUTUBE_TOKEN_JSON must contain an offline-access refresh token."
              )

          credentials = Path("credentials")
          credentials.mkdir(parents=True, exist_ok=True)
          files = {
              "YOUTUBE_CLIENT_SECRET_JSON": credentials / (
                  "client_secret_1049505599115-tikb4p4nuonlvt5lgbni9tcs4t4r1s8k.apps.googleusercontent.com.json"
              ),
              "YOUTUBE_TOKEN_JSON": credentials / "token.json",
          }
          for variable, path in files.items():
              path.write_text(os.environ[variable], encoding="utf-8")
              path.chmod(0o600)
          PY

      - name: Run StoryLoop
        shell: bash
        run: |
          # The repository is public and the pipeline prints generated content.
          # Keep raw output off public Actions logs; the step status remains visible.
          if python src/init.py > "$RUNNER_TEMP/storyloop-output.log" 2>&1; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          upload_file = Path("output/current_run/11_youtube_upload.json")
          if upload_file.exists():
              result = json.loads(upload_file.read_text(encoding="utf-8"))
              url = result.get("url")
              if url:
                  print(f"StoryLoop published: {url}")
              else:
                  print("StoryLoop completed; no public YouTube URL was returned.")
          else:
              print("StoryLoop completed without a YouTube upload result.")
          PY
          else
            echo "::error::StoryLoop failed. Raw output is withheld from this public repository's logs."
            exit 1
          fi
